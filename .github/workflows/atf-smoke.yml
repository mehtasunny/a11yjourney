name: atf-smoke
# Quick check of the Google ATF scanner on the system Settings app (no OneBusAway build).
on:
  push:
    branches: [oba-audit-2026-11]
    paths: ["upstream/atf-scan/**", ".github/workflows/atf-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build scanner
        working-directory: upstream/atf-scan
        run: ./gradlew --no-daemon :scanner:assembleDebug :scanner:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scan system Settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash upstream/atf-scan/smoke.sh

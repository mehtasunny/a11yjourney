name: oba-audit
# Audits OneBusAway for Android (github.com/OneBusAway/onebusaway-android) with A11yJourney,
# before and after the proposed accessibility patches in upstream/onebusaway/patches.
on:
  push:
    branches: [upstream-oba, oba-audit-2026-11]
  workflow_dispatch:

permissions:
  contents: write

env:
  OBA_SHA: 27c5818fcabf1fcfb021124eb27094f8a2232a72

jobs:
  build:
    name: Build baseline and patched OneBusAway
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: tool
      - uses: actions/checkout@v7
        with:
          repository: OneBusAway/onebusaway-android
          ref: ${{ env.OBA_SHA }}
          path: oba
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build baseline
        working-directory: oba
        run: |
          ./gradlew :onebusaway-android:assembleObaGoogleDebug --stacktrace > ../baseline-build.log 2>&1 || { tail -40 ../baseline-build.log; echo "::error title=baseline build::failed"; exit 1; }
          mkdir -p ../apks && cp "$(find onebusaway-android/build/outputs/apk/obaGoogle/debug -name '*.apk' | head -1)" ../apks/baseline.apk
          echo "::notice title=baseline build::ok"
      - name: Apply patches
        working-directory: oba
        run: |
          for p in ../tool/upstream/onebusaway/patches/OBA-S*.diff; do
            if git apply "$p"; then echo "::notice title=patch::applied $(basename "$p")"; else echo "::error title=patch::$(basename "$p") did not apply"; exit 1; fi
          done
      - name: Formatting (Spotless)
        working-directory: oba
        run: |
          ./gradlew spotlessCheck > ../spotless.log 2>&1 && echo "::notice title=spotless::ok" || { grep -E "violations|\.kt|^\s+[-+@]" ../spotless.log | head -40 | while read -r l; do echo "::error title=spotless::$l"; done; exit 1; }
      - name: Compile patched with warnings as errors
        working-directory: oba
        run: |
          ./gradlew :onebusaway-android:compileObaGoogleDebugKotlin :onebusaway-android:compileObaGoogleDebugAndroidTestKotlin -PwarningsAsErrors=true > ../compile.log 2>&1 && echo "::notice title=compile::ok" || { grep -E "^(e|w): " ../compile.log | head -40 | while read -r l; do echo "::error title=compile::$l"; done; tail -20 ../compile.log; exit 1; }
      - name: Unit tests and APKs
        working-directory: oba
        run: |
          ./gradlew :onebusaway-android:testObaGoogleDebugUnitTest :onebusaway-android:assembleObaGoogleDebug :onebusaway-android:assembleObaGoogleDebugAndroidTest -PwarningsAsErrors=true > ../unit.log 2>&1 && echo "::notice title=unit tests::ok" || { grep -E "FAILED|tests completed" ../unit.log | head -30 | while read -r l; do echo "::error title=unit tests::$l"; done; exit 1; }
          cp "$(find onebusaway-android/build/outputs/apk/obaGoogle/debug -name '*.apk' | head -1)" ../apks/patched.apk
          cp "$(find onebusaway-android/build/outputs/apk/androidTest/obaGoogle/debug -name '*.apk' | head -1)" ../apks/patched-test.apk
      - name: Build Google ATF scanner (second opinion)
        continue-on-error: true
        working-directory: tool/upstream/atf-scan
        run: |
          if ./gradlew --no-daemon :scanner:assembleDebug :scanner:assembleDebugAndroidTest > ../../../atf-build.log 2>&1; then
            cp scanner/build/outputs/apk/debug/scanner-debug.apk ../../../apks/atf-scan.apk
            cp scanner/build/outputs/apk/androidTest/debug/scanner-debug-androidTest.apk ../../../apks/atf-scan-test.apk
            echo "::notice title=atf build::ok"
          else
            grep -E "error:|e: |What went wrong|Could not" -A2 ../../../atf-build.log | head -30 | while read -r l; do echo "::warning title=atf build::$l"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: apks/

  lint:
    name: Android Lint on patched build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: tool
      - uses: actions/checkout@v7
        with:
          repository: OneBusAway/onebusaway-android
          ref: ${{ env.OBA_SHA }}
          path: oba
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Lint, published and patched
        working-directory: oba
        run: |
          # OneBusAway's own nightly lint can fail on upstream code, so only lint errors that the
          # patches add count against them.
          summarize() { f=$(find onebusaway-android/build/reports -name 'lint-results*.txt' | head -1); [ -n "$f" ] && grep -E ": (Error|Warning): " "$f" | sed -E 's/:[0-9]+: /: /' | sort -u; }
          ./gradlew :onebusaway-android:lintObaGoogleDebug -PwarningsAsErrors=true > ../lint-base.log 2>&1 || true
          summarize > ../lint-base.txt || true
          for p in ../tool/upstream/onebusaway/patches/OBA-S*.diff; do git apply "$p"; done
          ./gradlew :onebusaway-android:lintObaGoogleDebug -PwarningsAsErrors=true > ../lint.log 2>&1 || true
          summarize > ../lint-patched.txt || true
          comm -23 ../lint-patched.txt ../lint-base.txt > ../lint-new.txt
          while read -r l; do echo "::notice title=lint (already on OneBusAway main)::$l"; done < ../lint-base.txt
          if [ -s ../lint-new.txt ]; then
            while read -r l; do echo "::error title=lint (added by patches)::$l"; done < ../lint-new.txt
            exit 1
          fi
          echo "::notice title=lint::no new lint findings from the patches"

  audit:
    name: Audit on emulator (baseline vs patched)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run audits and instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash upstream/onebusaway/ci_audit.sh
      - name: Compare and publish to the oba-audit-results branch
        if: always()
        run: |
          python upstream/onebusaway/compare.py oba-audit/baseline oba-audit/patched oba-audit/SUMMARY.md || true
          grep -E "^- (agree|only|both)" oba-audit/ATF-COMPARISON.md 2>/dev/null | sed 's/^/::notice title=ATF comparison::/' || true
          grep -h '"check"' oba-audit/*/atf/*.jsonl 2>/dev/null | python3 -c "import sys,json,collections; c=collections.Counter(json.loads(l)['check'] for l in sys.stdin); [print(f'::notice title=ATF checks::{k} {v}') for k,v in c.most_common()]" || true
          cp upstream/onebusaway/README.md oba-audit/README.md 2>/dev/null || true
          mkdir -p /tmp/out && cp -r oba-audit/. /tmp/out/
          cd /tmp/out
          git init -q -b oba-audit-results
          git config user.name "oba-audit"
          git config user.email "oba-audit@users.noreply.github.com"
          git add -A && git commit -q -m "OneBusAway audit run ${GITHUB_RUN_ID} at ${GITHUB_SHA} (OBA ${OBA_SHA})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" oba-audit-results
